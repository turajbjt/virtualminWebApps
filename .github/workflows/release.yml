name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Perl & Utilities
        run: |
          perl -v
          tar --version

      - name: Build Standalone Release Archive
        run: |
          ./setup.sh package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: virtualmin-webapps-*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
