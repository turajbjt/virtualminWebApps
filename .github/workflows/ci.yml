name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Syntax, Security & Unit Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Perl installation
        run: |
          perl -v
          prove --version

      - name: Synchronize script symlinks
        run: |
          ./setup.sh update

      - name: Run Syntax, Security & Unit Test Suite
        run: |
          ./setup.sh test

      - name: Verify catalog listing and metadata extraction
        run: |
          ./setup.sh list

      - name: Check for broken symlinks in scripts/
        run: |
          find scripts/ -xtype l -print -exec false {} +
