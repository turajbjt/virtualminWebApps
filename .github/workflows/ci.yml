name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Shell & Script Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on shell scripts
        run: |
          shellcheck -e SC1091 -e SC2086 -e SC2155 setup.sh install.sh

  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Perl installation
        run: |
          perl -v
          prove --version

      - name: Synchronize script symlinks
        run: |
          ./setup.sh update

      - name: Run System and Repository Diagnostics
        run: |
          ./setup.sh doctor

      - name: Run Syntax, Security & Unit Test Suite
        run: |
          ./setup.sh test

      - name: Verify catalog listing and search CLI
        run: |
          ./setup.sh list
          ./setup.sh search media
          ./setup.sh info vaultwarden

      - name: Check for broken symlinks in scripts/
        run: |
          find scripts/ -xtype l -print -exec false {} +
